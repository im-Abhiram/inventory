{% extends 'base/base.html' %}

{% block title %}Access Denied (403) - Brick Management{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 p-5">
        <div class="mb-3">
            <span class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-10 text-danger fs-1">
                <i class="bi bi-shield-slash"></i>
            </span>
        </div>
        <h3 class="fw-bold text-dark mb-2">Access Denied (403)</h3>
        <p class="text-muted mb-4">
            {{ exception|default:"You do not have permission to access or modify this resource based on your current role." }}
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-brick px-4">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
            <button onclick="window.history.back()" class="btn btn-light border px-4">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
