<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) - Brick Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card border-0 shadow-lg rounded-4 p-5 text-center" style="max-width: 550px;">
        <div class="mb-3">
            <span class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-10 text-danger fs-1">
                <i class="bi bi-gear-wide-connected"></i>
            </span>
        </div>
        <h4 class="fw-bold text-dark mb-2">Temporary Application Issue</h4>
        <p class="text-muted small mb-4">
            An unexpected error occurred while processing your request. The issue has been logged and the database remains safe and consistent.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-brick px-4">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
            <button onclick="window.location.reload()" class="btn btn-light border px-4">
                <i class="bi bi-arrow-clockwise me-1"></i> Try Again
            </button>
        </div>
    </div>
</body>
</html>
